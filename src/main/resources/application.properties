spring.application.name=demoproj
spring.config.import=optional:file:.env[.properties]

# H2 (in-memory) datasource for development
spring.datasource.url=jdbc:h2:mem:demoprojdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MongoDB configuration
spring.data.mongodb.uri=${MONGODB_URI}

# Enable H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Disable open-in-view warning
spring.jpa.open-in-view=false

# JWT Security configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Redis Caching configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.type=redis

# Console Logging Configuration
spring.output.ansi.enabled=ALWAYS
logging.level.root=INFO
logging.level.com.sohel.demoproj=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.cache=DEBUG

# Structured & Colored Log Pattern
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}




