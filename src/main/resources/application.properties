spring.application.name=demoproj
spring.config.import=optional:file:.env[.properties]

# H2 (in-memory) datasource for development
spring.datasource.url=jdbc:h2:mem:demoprojdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MongoDB configuration
spring.data.mongodb.uri=${MONGODB_URI}

# Enable H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Disable open-in-view warning
spring.jpa.open-in-view=false

# JWT Security configuration (secret key must be at least 256 bits / 32 bytes)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000


